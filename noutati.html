<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Știri - Biserica Noastră</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Montserrat";
        }

        /* Font-Family-Declaration (copiez din CSS-ul tău) */
        @font-face {
            font-family: "Montserrat";
            src: url("../fonts/Montserrat-Bold.woff2") format("woff2"),
                url("../fonts/Montserrat-Bold.woff") format("woff");
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Montserrat";
            src: url("../fonts/Montserrat-Regular.woff2") format("woff2"),
                url("../fonts/Montserrat-Regular.woff") format("woff");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Montserrat";
            src: url("../fonts/Montserrat-Medium.woff2") format("woff2"),
                url("../fonts/Montserrat-Medium.woff") format("woff");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        html {
            scroll-behavior: smooth;

            --background-color-dark: hsl(202, 54%, 7%);
            --background-color-light: hsl(220, 23%, 97%);
            --white-text-color: var(--background-color-light);
            --dark-text-color: var(--background-color-dark);
            --small-text-color-light: hsl(30, 5%, 35%);
            --small-text-color-dark: hsl(30, 5%, 65%);

            --donation-color: hsl(5, 71%, 54%);
            --donation-color-hover: hsl(5, 71%, 44%);

            --first-accent-color: hsl(204, 54%, 48%);
            --second-accent-color: hsl(23, 79%, 57%);
            --third-accent-color: hsl(130, 52%, 58%);

            --first-accent-color-hover: hsl(204, 54%, 28%);
            --second-accent-color-hover: hsl(23, 79%, 37%);
            --third-accent-color-hover: hsl(130, 52%, 38%);

            --fs-h1: clamp(2.5rem, 6vw, 4rem);
            --fs-h2: clamp(2rem, 5vw, 3rem);
            --fs-h3: clamp(1.5rem, 4vw, 2.25rem);
            --fs-h4: clamp(1.25rem, 3vw, 1.75rem);
            --fs-h5: clamp(1.125rem, 2vw, 1.5rem);
            --fs-h6: clamp(1rem, 1.5vw, 1.25rem);
            --fs-body: 1rem;
            --fs-small: 0.875rem;

            --lh-heading: 0.9;
            --lh-heading-small: 1.05;
            --lh-body: 1.4;
            --lh-big-text: 1.7;
        }

        body {
            background-color: var(--background-color-light);
            color: var(--dark-text-color);
            line-height: var(--lh-body);
            font-family: "Montserrat";
        }

        .big-container {
            padding: 6.25em 0;
            position: relative;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 88%;
            margin: 0 auto;
        }

        .hero-subpage {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 50vh;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, var(--first-accent-color) 0%, var(--second-accent-color) 100%);
            color: var(--white-text-color);
            border-radius: 0.5em;
            margin-bottom: 4em;
        }

        .hero-title {
            font-size: var(--fs-h1);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.2em;
        }

        .hero-subtitle {
            margin: 0.2em auto 1.5em auto;
            font-size: var(--fs-h4);
            font-weight: 400;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2em;
            margin-bottom: 4em;
        }

        .news-card {
            background: white;
            border-radius: 0.5em;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid hsl(220, 23%, 90%);
        }

        .news-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .news-image {
            width: 100%;
            height: 45%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .news-card:hover .news-image {
            transform: scale(1.03);
        }

        .news-content {
            padding: 1.5em;
            display: flex;
            flex-direction: column;
            height: 55%;
            justify-content: space-between;
        }

        .news-date {
            color: var(--first-accent-color);
            font-size: var(--fs-small);
            font-weight: 500;
            margin-bottom: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .news-title {
            font-size: var(--fs-h5);
            font-weight: 700;
            color: var(--dark-text-color);
            margin-bottom: 0.8em;
            line-height: var(--lh-heading-small);
        }

        .news-description {
            color: var(--small-text-color-light);
            line-height: var(--lh-body);
            font-size: var(--fs-body);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5em;
            margin-top: 2em;
        }

        .btn {
            background-color: var(--first-accent-color);
            border-radius: 0.25rem;
            border: none;
            padding: calc(0.875rem - 1px) calc(1.5rem - 1px);
            color: var(--white-text-color);
            text-transform: uppercase;
            font-weight: 700;
            font-size: var(--fs-h6);
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover,
        .btn:focus {
            background-color: var(--first-accent-color-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.active {
            background-color: var(--second-accent-color);
        }

        .btn.active:hover {
            background-color: var(--second-accent-color-hover);
        }

        /* Stiluri pentru pagina de știre individuală */
        .news-article {
            display: none;
        }

        .article-header {
            text-align: center;
            margin-bottom: 3em;
        }

        .article-title {
            font-size: var(--fs-h2);
            color: var(--dark-text-color);
            margin-bottom: 1em;
            line-height: var(--lh-heading-small);
            font-weight: 700;
        }

        .article-meta {
            color: var(--first-accent-color);
            font-weight: 500;
            margin-bottom: 2em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: var(--fs-small);
        }

        .article-hero {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 0.5em;
            margin-bottom: 3em;
        }

        .article-content {
            font-size: var(--fs-body);
            line-height: var(--lh-big-text);
            color: var(--dark-text-color);
            margin-bottom: 3em;
        }

        .article-content p {
            margin: 1.2em 0;
            font-weight: 400;
        }

        .article-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1em;
            margin: 3em 0;
        }

        .gallery-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 0.5em;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .gallery-image:hover {
            transform: scale(1.03);
        }

        .back-button {
            background-color: var(--second-accent-color);
            margin-bottom: 2em;
        }

        .back-button:hover {
            background-color: var(--second-accent-color-hover);
        }

        .fadeIn {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease;
        }

        .fadeIn.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 1025px) {
            .news-grid {
                grid-template-columns: 1fr;
                gap: 1.5em;
            }
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: var(--fs-h2);
            }
            
            .hero-subtitle {
                font-size: var(--fs-h6);
            }

            .big-container {
                padding: 3em 0;
            }

            .news-content {
                padding: 1em;
            }

            .article-title {
                font-size: var(--fs-h3);
            }

            .pagination {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

        <div class="container">

                <p class="hero-subtitle">Rămâi conectat cu activitățile și evenimentele noastre</p>

            <!-- Lista de știri -->
            <div id="news-list">

                <div class="pagination" id="pagination">
                    <!-- Paginarea va fi generată dinamic aici -->
                </div>
            </div>

            <!-- Articol individual -->
            <div id="news-article" class="news-article">
                <button class="btn back-button" onclick="showNewsList()">← Înapoi la știri</button>
                
                <div class="article-header">
                    <h1 class="article-title" id="article-title"></h1>
                    <div class="article-meta" id="article-date"></div>
                </div>

                <img class="article-hero" id="article-hero" src="" alt="">
                
                <div class="article-content" id="article-content"></div>
                
                <div class="article-gallery" id="article-gallery">
                    <!-- Galeria de imagini va fi generată dinamic -->
                </div>
            </div>
        </div>
    </div>

                gallery: []
            },
            {
                id: 10,
                title: "Binecuvântarea caselor noi",
                description: "Părintele paroh anunță că în următoarele două săptămâni vor avea loc binecuvântările caselor noi din parohie. Pentru programări, contactați secretariatul.",
                date: "2025-01-25",
                image: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=600&h=400&fit=crop",
                content: "Părintele paroh anunță că în următoarele două săptămâni va avea loc programul tradițional de binecuvântare a caselor noi din parohie, o tradiție spirituală de mare importanță în viața credincioșilor ortodocși.\n\nBinecuvântarea casei noi reprezintă un moment solemn în care invităm pe Dumnezeu să locuiască în căminul nostru și să ne ocrotească familia. Este un gest de consacrare a spațiului de locuit, prin care cerem ajutorul divin pentru o viață în pace, sănătate și armonie.\n\nCeremonia include citirea unor rugăciuni speciale, stropirea cu agheasmă a tuturor camerelor casei și binecuvântarea icoanei care va fi plasată în colțul sfânt al locuinței. Părintele va oferi și sfaturi spirituale pentru crearea unui cămin creștin autentic.",
                gallery: []
            }
        ];

        let currentPage = 1;
        const itemsPerPage = 8;

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('ro-RO', options);
        }

        function renderNews() {
            const newsGrid = document.getElementById('news-grid');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = newsData.slice(startIndex, endIndex);

            newsGrid.innerHTML = '';

            pageData.forEach((news, index) => {
                const newsCard = document.createElement('div');
                newsCard.className = 'news-card fadeIn';
                newsCard.onclick = () => showNewsArticle(news.id);

                newsCard.innerHTML = `
                    <img src="${news.image}" alt="${news.title}" class="news-image">
                    <div class="news-content">
                        <div class="news-date">${formatDate(news.date)}</div>
                        <h3 class="news-title">${news.title}</h3>
                        <p class="news-description">${news.description}</p>
                    </div>
                `;

                newsGrid.appendChild(newsCard);

                // Animație fade-in cu delay
                setTimeout(() => {
                    newsCard.classList.add('visible');
                }, index * 100);
            });

            renderPagination();
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(newsData.length / itemsPerPage);
            
            pagination.innerHTML = '';

            // Buton Previous
            const prevButton = document.createElement('button');
            prevButton.className = 'btn';
            prevButton.textContent = '« Anterior';
            prevButton.disabled = currentPage === 1;
            prevButton.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderNews();
                    window.scrollTo(0, 0);
                }
            };
            pagination.appendChild(prevButton);

            // Numere pagini
            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = currentPage === i ? 'btn active' : 'btn';
                pageButton.textContent = i;
                pageButton.onclick = () => {
                    currentPage = i;
                    renderNews();
                    window.scrollTo(0, 0);
                };
                pagination.appendChild(pageButton);
            }

            // Buton Next
            const nextButton = document.createElement('button');
            nextButton.className = 'btn';
            nextButton.textContent = 'Următor »';
            nextButton.disabled = currentPage === totalPages;
            nextButton.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderNews();
                    window.scrollTo(0, 0);
                }
            };
            pagination.appendChild(nextButton);
        }

        function showNewsArticle(newsId) {
            const news = newsData.find(n => n.id === newsId);
            if (!news) return;

            // Adaugă în istoricul browserului
            history.pushState({view: 'article', id: newsId}, '', `#stire-${newsId}`);

            document.getElementById('news-list').style.display = 'none';
            document.getElementById('news-article').style.display = 'block';

            document.getElementById('article-title').textContent = news.title;
            document.getElementById('article-date').textContent = formatDate(news.date);
            document.getElementById('article-hero').src = news.image;
            document.getElementById('article-hero').alt = news.title;
            
            // Formatează conținutul cu paragrafe
            const formattedContent = news.content.split('\n').map(p => `<p>${p}</p>`).join('');
            document.getElementById('article-content').innerHTML = formattedContent;

            // Randează galeria dacă există
            const gallery = document.getElementById('article-gallery');
            gallery.innerHTML = '';
            if (news.gallery && news.gallery.length > 0) {
                news.gallery.forEach(imageUrl => {
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.className = 'gallery-image';
                    img.alt = 'Galerie imagine';
                    img.onclick = () => openImageModal(imageUrl);
                    gallery.appendChild(img);
                });
            }

            window.scrollTo(0, 0);
        }

        function showNewsList() {
            // Adaugă în istoricul browserului
            history.pushState({view: 'list'}, '', '#');

            document.getElementById('news-article').style.display = 'none';
            document.getElementById('news-list').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // Gestionează butonul Back din browser
        window.addEventListener('popstate', function(event) {
            if (event.state) {
                if (event.state.view === 'article') {
                    showNewsArticleWithoutHistory(event.state.id);
                } else if (event.state.view === 'list') {
                    showNewsListWithoutHistory();
                }
            } else {
                showNewsListWithoutHistory();
            }
        });

        function showNewsArticleWithoutHistory(newsId) {
            const news = newsData.find(n => n.id === newsId);
            if (!news) return;

            document.getElementById('news-list').style.display = 'none';
            document.getElementById('news-article').style.display = 'block';

            document.getElementById('article-title').textContent = news.title;
            document.getElementById('article-date').textContent = formatDate(news.date);
            document.getElementById('article-hero').src = news.image;
            document.getElementById('article-hero').alt = news.title;
            
            const formattedContent = news.content.split('\n').map(p => `<p>${p}</p>`).join('');
            document.getElementById('article-content').innerHTML = formattedContent;

            const gallery = document.getElementById('article-gallery');
            gallery.innerHTML = '';
            if (news.gallery && news.gallery.length > 0) {
                news.gallery.forEach(imageUrl => {
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.className = 'gallery-image';
                    img.alt = 'Galerie imagine';
                    img.onclick = () => openImageModal(imageUrl);
                    gallery.appendChild(img);
                });
            }

            window.scrollTo(0, 0);
        }

        function showNewsListWithoutHistory() {
            document.getElementById('news-article').style.display = 'none';
            document.getElementById('news-list').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function openImageModal(imageUrl) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.9);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
                cursor: pointer;
            `;
            
            const img = document.createElement('img');
            img.src = imageUrl;
            img.style.cssText = `
                max-width: 90%;
                max-height: 90%;
                object-fit: contain;
                border-radius: 0.5em;
            `;
            
            modal.appendChild(img);
            modal.onclick = () => document.body.removeChild(modal);
            document.body.appendChild(modal);
        }

        // Inițializare la încărcarea paginii
        document.addEventListener('DOMContentLoaded', function() {
            // Verifică dacă avem un hash în URL la încărcarea paginii
            const hash = window.location.hash;
            if (hash && hash.startsWith('#stire-')) {
                const newsId = parseInt(hash.replace('#stire-', ''));
                if (newsData.find(n => n.id === newsId)) {
                    showNewsArticleWithoutHistory(newsId);
                    return;
                }
            }
            
            // Setează state-ul inițial
            history.replaceState({view: 'list'}, '', '#');
            renderNews();
        });
    </script>
</body>
